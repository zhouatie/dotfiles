onboarding = false
[ui]
agent_panel_sort = "priority"
right_click_passthrough_modifier = "ctrl"

show_agent_labels_on_pane_borders = false
[keys]
prefix = "cmd+s"
# prefix = "ctrl+a"

# Switch tabs with Ctrl+[ (previous) and Ctrl+] (next)
previous_tab = "ctrl+["
next_tab = "ctrl+]"

# Switch agents with cmd+ctrl+[ / ]
previous_agent = "cmd+ctrl+["
next_agent = "cmd+ctrl+]"

# Switch workspaces with cmd+shift+ctrl+[ / ]
previous_workspace = "cmd+shift+ctrl+["
next_workspace = "cmd+shift+ctrl+]"

# Optional: Focus Tabs/Panes/Agents when open navigator
[[keys.command]]
key = "cmd+i"
type = "plugin_action"
command = "beyondlex.herdr-recent-navigator.focus-tabs"
description = "Open Navigator: Tab"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[[keys.command]] # open in a split pane
key = "prefix+y"
type = "plugin_action"
command = "ray.file-explorer.open"
description = "open file explorer"

[[keys.command]] # open in a new tab
key = "prefix+Y"
type = "plugin_action"
command = "ray.file-explorer.open-tab"
description = "open file explorer in a new tab"

# 显式声明深色主题
[theme]
name = "catppuccin"

auto_switch = false
[ui.toast]
delivery = "system"

[experimental]
kitty_graphics = true

# Worktree plugin bindings (added by config task)
[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch / create from default branch"

